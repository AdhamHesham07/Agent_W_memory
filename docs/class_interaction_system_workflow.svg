<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1200" viewBox="0 0 2600 1200" role="img" aria-labelledby="title desc">
<title id="title">Class Structure Diagram</title><desc id="desc">Clear class and module dependency map for the travel memory agent. Runtime workflow section removed.</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#334155"/></marker><marker id="open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 1L12 7L1 13" fill="white" stroke="#64748b" stroke-width="2"/></marker><marker id="dia" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M2 7L8 2L14 7L8 12Z" fill="white" stroke="#64748b" stroke-width="1.5"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:42px;font-weight:700}.sub{font-size:19px;fill:#475569}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:18}.gt{font-size:22px;font-weight:700;fill:#1e3a8a}.cls{fill:#ecfdf5;stroke:#059669;stroke-width:2.5;rx:10}.dto{fill:#f3e8ff;stroke:#9333ea;stroke-width:2.5;rx:10}.framework{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.db{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:10}.module{fill:#fff;stroke:#64748b;stroke-width:2;rx:10}.head{font-size:20px;font-weight:700}.file{font-size:15px;fill:#475569}.body{font-size:17px}.small{font-size:15px;fill:#475569}.sep{stroke:#cbd5e1;stroke-width:1.5}.dep{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#open)}.assoc{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arr)}.comp{fill:none;stroke:#334155;stroke-width:2.5;marker-start:url(#dia);marker-end:url(#arr)}.label{font-size:15px;font-weight:700;fill:#334155}
</style></defs><rect width="2600" height="1200" fill="#fff"/>
<text x="1300" y="62" text-anchor="middle" class="title">Class Interaction &amp; System Workflow Diagram</text><text x="1300" y="99" text-anchor="middle" class="sub">Section A — Class Structure · verified project classes, framework objects, and dependencies</text>

<!-- Group 1 -->
<rect x="45" y="140" width="600" height="870" class="group"/><text x="75" y="182" class="gt">Persistence / memory layer</text>
<rect x="85" y="220" width="520" height="410" class="cls"/><text x="110" y="258" class="head">MemoryStore</text><text x="110" y="286" class="file">travel_agent/memory/store.py</text><line x1="85" y1="303" x2="605" y2="303" class="sep"/><text x="110" y="337" class="body">path: str</text><text x="110" y="366" class="body">SQLite tables: preferences · episodes · procedures</text><line x1="85" y1="385" x2="605" y2="385" class="sep"/><text x="110" y="420" class="body">+ save_preference(user, category, value)</text><text x="110" y="452" class="body">+ add_episode(user, summary)</text><text x="110" y="484" class="body">+ add_rule(user, rule)</text><text x="110" y="516" class="body">+ get_all(user, n_episodes=5)</text><text x="110" y="548" class="body">+ budget_ceiling(user)</text><text x="110" y="580" class="body">+ reset(user)</text><text x="110" y="610" class="small">_db() creates, commits, and closes a SQLite connection per operation.</text>
<rect x="85" y="700" width="520" height="190" class="db"/><text x="110" y="740" class="head">SQLite long-term memory database</text><text x="110" y="770" class="file">data/long_term_memory.sqlite</text><line x1="85" y1="786" x2="605" y2="786" class="sep"/><text x="110" y="820" class="body">preferences · episodes · procedures</text><text x="110" y="854" class="small">MemoryStore initializes schema and executes queries.</text><path d="M345 630V690" class="comp"/><text x="365" y="671" class="label">opens per operation</text>

<!-- Group 2 -->
<rect x="680" y="140" width="560" height="870" class="group"/><text x="710" y="182" class="gt">Structured extraction models</text>
<rect x="720" y="220" width="480" height="250" class="dto"/><text x="745" y="258" class="head">ExtractedMemory</text><text x="745" y="286" class="file">travel_agent/orchestration/agent.py</text><text x="745" y="313" class="small">extends external pydantic.BaseModel</text><line x1="720" y1="329" x2="1200" y2="329" class="sep"/><text x="745" y="366" class="body">preferences: list[Preference]</text><text x="745" y="400" class="body">style_rules: list[str]</text><text x="745" y="445" class="small">Schema returned by model.with_structured_output(...)</text>
<rect x="720" y="550" width="480" height="250" class="dto"/><text x="745" y="588" class="head">Preference</text><text x="745" y="616" class="file">travel_agent/orchestration/agent.py</text><text x="745" y="643" class="small">extends external pydantic.BaseModel</text><line x1="720" y1="659" x2="1200" y2="659" class="sep"/><text x="745" y="696" class="body">category: likes | avoids | budget | other</text><text x="745" y="730" class="body">value: str</text><text x="745" y="775" class="small">No custom methods; validated structured data.</text><path d="M960 470V540" class="assoc"/><text x="982" y="515" class="label">1 contains 0..*</text>

<!-- Group 3 -->
<rect x="1275" y="140" width="620" height="870" class="group"/><text x="1305" y="182" class="gt">Application modules · no custom controller class</text>
<rect x="1315" y="220" width="540" height="350" class="module"/><text x="1340" y="258" class="head">orchestration/agent.py</text><text x="1340" y="286" class="file">Module functions and state dictionaries</text><line x1="1315" y1="303" x2="1855" y2="303" class="sep"/><text x="1340" y="339" class="body">create_runtime() → model + MemoryStore + DB connection</text><text x="1340" y="372" class="body">run_agent(runtime, user_id, thread_id, text)</text><text x="1340" y="405" class="body">_extract_and_save() · _system_prompt() · _snapshot()</text><text x="1340" y="438" class="body">conversation_messages(runtime, thread_id)</text><text x="1340" y="485" class="small">Creates SqliteSaver and LangChain agent at runtime.</text><text x="1340" y="515" class="small">Preference and episode updates go through MemoryStore.</text><text x="1340" y="545" class="small">Returns a generator of state snapshots.</text>
<rect x="1315" y="625" width="540" height="300" class="module"/><text x="1340" y="663" class="head">interface/gradio_app.py</text><text x="1340" y="691" class="file">Module functions + framework-created components</text><line x1="1315" y1="708" x2="1855" y2="708" class="sep"/><text x="1340" y="744" class="body">build_app() creates Gradio Blocks and components</text><text x="1340" y="777" class="body">on_send() → run_agent() → render/update panels</text><text x="1340" y="810" class="body">start_new_conversation() creates a new thread UUID</text><text x="1340" y="843" class="body">render_memory() → MemoryStore + conversation_messages()</text><text x="1340" y="890" class="small">Gradio invokes callbacks for submit/click events.</text>
<path d="M1585 570V615" class="assoc"/><text x="1600" y="603" class="label">direct module calls</text>

<!-- Group 4 -->
<rect x="1930" y="140" width="625" height="870" class="group"/><text x="1960" y="182" class="gt">Frameworks, tools, external integrations</text>
<rect x="1970" y="220" width="545" height="235" class="module"/><text x="1995" y="258" class="head">tools/travel.py · build_tools(memory, user_id)</text><line x1="1970" y1="275" x2="2515" y2="275" class="sep"/><text x="1995" y="312" class="body">Creates 5 @tool closure functions:</text><text x="1995" y="345" class="body">search_flights · search_hotels · find_attractions</text><text x="1995" y="378" class="body">search_restaurants · get_weather</text><text x="1995" y="421" class="small">Closures bind MemoryStore + user_id; no tool class.</text>
<rect x="1970" y="500" width="545" height="180" class="framework"/><text x="1995" y="538" class="head">LangChain agent + @tool wrappers</text><text x="1995" y="566" class="file">External framework objects</text><line x1="1970" y1="583" x2="2515" y2="583" class="sep"/><text x="1995" y="620" class="body">create_agent(model, tools, prompt, checkpointer)</text><text x="1995" y="652" class="small">Model tool calls trigger framework-managed tool execution.</text>
<rect x="1970" y="720" width="255" height="160" class="framework"/><text x="1990" y="758" class="head">Chat model</text><text x="1990" y="786" class="file">Gemini via init_chat_model</text><line x1="1970" y1="803" x2="2225" y2="803" class="sep"/><text x="1990" y="840" class="body">Structured extraction</text><text x="1990" y="866" class="body">+ agent response/tool choice</text>
<rect x="2260" y="720" width="255" height="160" class="framework"/><text x="2280" y="758" class="head">SqliteSaver</text><text x="2280" y="786" class="file">LangGraph checkpointer</text><line x1="2260" y1="803" x2="2515" y2="803" class="sep"/><text x="2280" y="840" class="body">Conversation state</text><text x="2280" y="866" class="body">by thread_id</text>
<rect x="1970" y="920" width="545" height="60" class="db"/><text x="1995" y="958" class="body">data/conversation_checkpoints.sqlite</text>

<!-- dependencies across groups -->
<path d="M1315 400H1220V345H1200" class="dep"/><text x="1210" y="330" class="label">structured schema</text>
<path d="M1315 480H650V430H605" class="dep"/><text x="980" y="468" class="label">uses MemoryStore</text>
<path d="M1855 490H1958V355H1970" class="dep"/><text x="1870" y="475" class="label">builds tool bindings</text>
<path d="M1855 450H1935V800H1960" class="dep"/><text x="1863" y="720" class="label">uses model</text>
<path d="M1855 515H1915V800H2250" class="dep"/><text x="1863" y="745" class="label">uses checkpoint saver</text>
<path d="M2245 880V910" class="comp"/>
<text x="1300" y="1060" text-anchor="middle" class="small">Dashed arrows = dependency/use · solid arrows = association/call · diamond = composition · DTO boxes inherit from external Pydantic BaseModel</text>
<text x="1300" y="1092" text-anchor="middle" class="small">Gradio, LangChain, LangGraph, Pydantic, Gemini model classes are framework/external objects; no custom UI/controller/service class or DI container exists in the source.</text>
<text x="1300" y="1130" text-anchor="middle" class="sub">Static class/module structure only — runtime sequence section removed as requested.</text>
</svg>
